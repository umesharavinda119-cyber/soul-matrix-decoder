<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RADIANCE OF NUMBERS | Ultimate Real Universe</title>
    
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Orbitron:wght@400;600;800;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Three.js (For Floating Numbers & Dust) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --bg-dark: #000000;
            --card-bg: rgba(6, 6, 18, 0.65);
            --accent-purple: #a855f7;
            --accent-cyan: #06b6d4;
            --accent-gold: #f59e0b;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 1. CINEMATIC BACKGROUND */
        .real-bg {
            position: fixed;
            top: -5%; left: -5%; 
            width: 110vw; height: 110vh;
            background: url('bg.jpg') no-repeat center center;
            background-size: cover;
            z-index: 0;
            animation: cinematicPan 40s linear infinite alternate;
        }
        @keyframes cinematicPan {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.08) translate(-15px, -15px); }
        }

        .ambient-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, rgba(0,0,0,0.2) 20%, rgba(0,0,0,0.9) 100%);
            z-index: 1; pointer-events: none;
        }

        #webgl-canvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 2; pointer-events: none;
        }

        /* Header Navigation */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.2rem 5%;
            background: rgba(2, 2, 8, 0.5); backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(168, 85, 247, 0.25);
            position: fixed; width: 100%; top: 0; z-index: 100;
        }

        .logo {
            font-family: 'Cinzel', serif; font-size: 1.3rem; font-weight: 900; letter-spacing: 2px;
            background: linear-gradient(135deg, #fff, var(--accent-purple), var(--accent-cyan));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            display: flex; align-items: center; gap: 10px;
        }

        .header-controls { display: flex; align-items: center; gap: 18px; }

        .live-clock {
            font-family: 'Orbitron', sans-serif; font-size: 0.85rem; color: var(--accent-cyan);
            background: rgba(6, 182, 212, 0.08); padding: 0.4rem 0.9rem; border-radius: 4px;
            border: 1px solid rgba(6, 182, 212, 0.3); letter-spacing: 1px;
        }

        .audio-toggle {
            width: 38px; height: 38px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex; justify-content: center; align-items: center;
            color: #fff; cursor: pointer; transition: all 0.3s ease;
        }

        /* Hero Section */
        .hero {
            padding-top: 140px; padding-bottom: 60px;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            max-width: 1100px; margin: 0 auto; position: relative; z-index: 20;
        }

        .badge {
            font-family: 'Orbitron', sans-serif;
            background: rgba(245, 158, 11, 0.15); border: 1px solid var(--accent-gold);
            color: var(--accent-gold); padding: 0.4rem 1.2rem; border-radius: 4px;
            font-size: 0.75rem; letter-spacing: 2px; margin-bottom: 1.2rem;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.25);
        }

        .hero h1 {
            font-family: 'Cinzel', serif; font-size: 3.5rem; font-weight: 900; line-height: 1.2; margin-bottom: 0.8rem;
            background: linear-gradient(180deg, #ffffff 40%, var(--accent-cyan));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .hero p { color: var(--text-main); font-size: 1.05rem; max-width: 650px; line-height: 1.6; margin-bottom: 2rem; }

        /* Trigger Button for Form Modal */
        .open-modal-btn {
            position: relative;
            z-index: 10;
            padding: 1.1rem 2.5rem;
            background: linear-gradient(135deg, var(--accent-gold), #d97706);
            border: 1px solid #fef08a; border-radius: 50px;
            color: #000; font-family: 'Orbitron', sans-serif; font-size: 0.95rem; font-weight: 800;
            cursor: pointer; transition: all 0.3s ease; letter-spacing: 1px;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.4);
            display: inline-flex; align-items: center; gap: 12px;
        }
        .open-modal-btn:hover { transform: scale(1.05); box-shadow: 0 0 40px rgba(245, 158, 11, 0.8); }

        /* ================================================================= */
        /* MODAL POPUP & OVERLAY LAYER FIX (100% OVERLAY PROOF) */
        /* ================================================================= */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(2, 2, 10, 0.88);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            z-index: 99999; /* HIGHEST LAYER TO COVER EVERYTHING */
            display: none; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-card {
            background: rgba(8, 8, 22, 0.95);
            border: 1px solid rgba(245, 158, 11, 0.5);
            border-radius: 18px; padding: 2.2rem; width: 100%; max-width: 500px;
            position: relative; z-index: 100000;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95), inset 0 0 30px rgba(245, 158, 11, 0.1);
            max-height: 90vh; overflow-y: auto;
        }

        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 1rem; margin-bottom: 1.5rem;
        }

        .modal-title {
            font-family: 'Orbitron', sans-serif; font-size: 1.25rem; font-weight: 800;
            color: var(--accent-gold); letter-spacing: 1.5px;
        }

        .close-btn {
            background: none; border: none; color: #fff; font-size: 1.5rem;
            cursor: pointer; transition: color 0.2s;
        }
        .close-btn:hover { color: var(--accent-purple); }

        .form-subtext { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 1.5rem; line-height: 1.5; }

        .form-group { margin-bottom: 1.2rem; text-align: left; }
        .form-group label {
            display: block; font-size: 0.82rem; font-family: 'Inter', sans-serif;
            color: var(--accent-cyan); margin-bottom: 0.4rem; font-weight: 600;
        }

        .form-control {
            width: 100%; padding: 0.85rem 1rem;
            background: rgba(2, 2, 10, 0.9); border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: 8px; color: #fff; font-size: 0.9rem; outline: none;
            transition: all 0.3s ease;
        }
        .form-control:focus { border-color: var(--accent-purple); box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); }

        select.form-control option { background: #060612; color: #fff; }

        .submit-btn {
            width: 100%; padding: 1rem; margin-top: 1rem;
            background: linear-gradient(135deg, var(--accent-gold), #d97706);
            border: none; border-radius: 8px; color: #000; font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem; font-weight: 800; cursor: pointer; transition: all 0.3s ease;
            letter-spacing: 1px;
        }
        .submit-btn:hover { box-shadow: 0 0 25px rgba(245, 158, 11, 0.6); transform: translateY(-2px); }

        /* HUD Corners */
        .hud-corner { position: absolute; width: 10px; height: 10px; border: 2px solid var(--accent-gold); pointer-events: none; }
        .hud-tl { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .hud-tr { top: -2px; right: -2px; border-left: none; border-bottom: none; }
        .hud-bl { bottom: -2px; left: -2px; border-right: none; border-top: none; }
        .hud-br { bottom: -2px; right: -2px; border-left: none; border-top: none; }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.2rem; }
            .modal-card { padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <audio id="bg-audio" loop preload="auto">
        <source src="Tone.mp3" type="audio/mpeg">
    </audio>

    <div class="real-bg"></div>
    <div class="ambient-overlay"></div>
    <canvas id="webgl-canvas"></canvas>

    <header>
        <div class="logo">
            <div style="width:10px; height:10px; background:var(--accent-gold); border-radius:50%; box-shadow:0 0 15px var(--accent-gold);"></div>
            RADIANCE OF NUMBERS
        </div>
        <div class="header-controls">
            <div class="live-clock" id="clock-display">00:00:00 AM</div>
            <div class="audio-toggle" id="audio-toggle-btn"><i class="fa-solid fa-volume-xmark" id="audio-icon"></i></div>
        </div>
    </header>

    <section class="hero">
        <div class="badge">ULTIMATE REALITY MATRIX</div>
        <h1>DECODE YOUR SOUL MATRIX</h1>
        <p>ආත්මයේ සංඛ්‍යා න්‍යාසය සහ ජ්‍යොතිෂමය කර්මජ දත්ත එකම තාක්ෂණික පද්ධතියකින් නිවැරදිවම විශ්ලේෂණය කරගන්න.</p>

        <!-- Main Button to Open Modal -->
        <button class="open-modal-btn" id="trigger-btn" onclick="openModal()">
            <i class="fa-solid fa-compass"></i> ජන්ම පත්‍රය සැකසීම
        </button>
    </section>

    <!-- ================================================================= -->
    <!-- FIXED FORM MODAL (OVERLAY-PROOF WITH MARITAL STATUS FIXED) -->
    <!-- ================================================================= -->
    <div class="modal-overlay" id="decoder-modal">
        <div class="modal-card">
            <div class="hud-corner hud-tl"></div>
            <div class="hud-corner hud-tr"></div>
            <div class="hud-corner hud-bl"></div>
            <div class="hud-corner hud-br"></div>

            <div class="modal-header">
                <div class="modal-title">SOUL MATRIX DECODER</div>
                <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <p class="form-subtext">නිවැරදි ජ්‍යොතිෂමය දත්ත සඳහා ඔබගේ උපන් තොරතුරු ලබා දෙන්න.</p>

            <form id="matrix-form" onsubmit="handleFormSubmit(event)">
                <div class="form-group">
                    <label><i class="fa-solid fa-user"></i> සම්පූර්ණ නම</label>
                    <input type="text" class="form-control" placeholder="Ex: Umesh (Mars/No.9)" required>
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-heart"></i> විවාහක / අවිවාහක බව</label>
                    <select class="form-control" id="marital-status" required>
                        <option value="single">අවිවාහක (Single)</option>
                        <option value="married">විවාහක (Married)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-calendar-days"></i> උපන් දිනය</label>
                    <input type="date" class="form-control" id="dob" required>
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-clock"></i> උපන් වේලාව (පැය 24)</label>
                    <input type="time" class="form-control" id="birthtime" required>
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-location-dot"></i> උපන් ස්ථානය</label>
                    <input type="text" class="form-control" placeholder="Ex: Castle Hospital, Colombo" required>
                </div>

                <button type="submit" class="submit-btn">GENERATE MATRIX</button>
            </form>
        </div>
    </div>

    <script>
        // =================================================================
        // MODAL OPEN / CLOSE CONTROLLER (HIDE TRIGGER BUTTON TO PREVENT OVERLAY)
        // =================================================================
        const modal = document.getElementById('decoder-modal');
        const triggerBtn = document.getElementById('trigger-btn');

        function openModal() {
            modal.classList.add('active');
            // Hide trigger button when modal opens to avoid overlap
            if (triggerBtn) triggerBtn.style.visibility = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('active');
            // Restore trigger button visibility when modal closes
            if (triggerBtn) triggerBtn.style.visibility = 'visible';
        }

        // Close on clicking backdrop
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        function handleFormSubmit(e) {
            e.preventDefault();
            const status = document.getElementById('marital-status').value;
            alert('දත්ත සාර්ථකව පද්ධතියට ඇතුළත් විය! (' + (status === 'married' ? 'විවාහක' : 'අවිවාහක') + ' මෝඩය සක්‍රිය විය)');
            closeModal();
        }

        // =================================================================
        // AUDIO & THREE.JS ENGINE
        // =================================================================
        const audio = document.getElementById('bg-audio');
        const audioBtn = document.getElementById('audio-toggle-btn');
        const audioIcon = document.getElementById('audio-icon');

        audioBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().catch(()=>{});
                audioIcon.className = 'fa-solid fa-volume-high';
            } else {
                audio.pause();
                audioIcon.className = 'fa-solid fa-volume-xmark';
            }
        });

        // Clock
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock-display').innerText = now.toLocaleTimeString();
        }, 1000);

        // Three.js Dust background
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        camera.position.z = 100;

        const dustGeo = new THREE.BufferGeometry();
        const dustCount = 600;
        const dustPos = new Float32Array(dustCount * 3);
        for(let i=0; i<dustCount*3; i++) dustPos[i] = (Math.random() - 0.5) * 400;
        dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
        const dustMat = new THREE.PointsMaterial({ size: 1.2, color: 0xf59e0b, transparent: true, opacity: 0.5 });
        const dustField = new THREE.Points(dustGeo, dustMat);
        scene.add(dustField);

        function animate() {
            requestAnimationFrame(animate);
            dustField.rotation.y += 0.0006;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
