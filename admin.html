<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOUL MATRIX | Admin Control Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #04040c; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .admin-card { background: linear-gradient(135deg, rgba(12, 12, 28, 0.98), rgba(4, 4, 12, 0.99)); border: 1.5px solid #06b6d4; border-radius: 16px; padding: 2rem; width: 100%; max-width: 500px; box-shadow: 0 0 40px rgba(6, 182, 212, 0.25); }
        h2 { font-family: 'Orbitron', sans-serif; color: #06b6d4; text-align: center; margin-bottom: 20px; font-size: 1.4rem; letter-spacing: 1px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 0.85rem; color: #f59e0b; margin-bottom: 8px; font-family: 'Orbitron', sans-serif; }
        input[type="text"], input[type="password"], input[type="file"] { width: 100%; padding: 12px; background: rgba(2, 2, 10, 0.9); border: 1px solid rgba(6, 182, 212, 0.4); border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; }
        input[type="text"]:focus { border-color: #f59e0b; box-shadow: 0 0 10px rgba(245, 158, 11, 0.3); }
        .upload-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #06b6d4, #0284c7); border: none; border-radius: 8px; color: #000; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1rem; cursor: pointer; transition: all 0.2s; margin-top: 10px; }
        .upload-btn:hover { background: linear-gradient(135deg, #38bdf8, #06b6d4); box-shadow: 0 0 20px rgba(6, 182, 212, 0.5); }
        .progress-box { display: none; margin-top: 15px; background: rgba(255,255,255,0.05); border-radius: 8px; padding: 10px; text-align: center; }
        .progress-bar { width: 0%; height: 8px; background: linear-gradient(90deg, #06b6d4, #f59e0b); border-radius: 4px; transition: width 0.2s; }
        #status-msg { margin-top: 10px; font-size: 0.85rem; font-weight: 600; text-align: center; }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2><i class="fa-solid fa-user-shield"></i> BLUEPRINT ADMIN PANEL</h2>
        
        <form id="admin-upload-form">
            <div class="form-group">
                <label>ADMIN ACCESS CODE</label>
                <input type="password" id="admin-pass" placeholder="Enter Secret Key" required>
            </div>

            <div class="form-group">
                <label>CUSTOMER DIGIT LIFE CODE (8-DIGITS)</label>
                <input type="text" id="life-code-input" placeholder="E.g. 29637242" maxlength="8" pattern="\d{8}" required>
            </div>

            <div class="form-group">
                <label>CUSTOMER NAME (OPTIONAL)</label>
                <input type="text" id="customer-name-input" placeholder="E.g. Miheli Sahasna">
            </div>

            <div class="form-group">
                <label>SELECT BLUEPRINT PDF REPORT</label>
                <input type="file" id="pdf-file-input" accept="application/pdf" required>
            </div>

            <button type="submit" class="upload-btn" id="btn-submit">
                <i class="fa-solid fa-cloud-arrow-up"></i> UPLOAD & LINK REPORT
            </button>
        </form>

        <div class="progress-box" id="prog-box">
            <div class="progress-bar" id="prog-bar"></div>
            <p id="status-msg">Preparing file...</p>
        </div>
    </div>

    <script>
        // 1. YOUR FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyAS1LHsxDHPFwxe7w8ByzbIdFbJogwnYq8",
            authDomain: "soul-matrix-b0fdf.firebaseapp.com",
            projectId: "soul-matrix-b0fdf",
            storageBucket: "soul-matrix-b0fdf.firebasestorage.app",
            messagingSenderId: "68411238048",
            appId: "1:68411238048:web:8ea31ad61d8c985d474bc5"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        const form = document.getElementById('admin-upload-form');
        const progBox = document.getElementById('prog-box');
        const progBar = document.getElementById('prog-bar');
        const statusMsg = document.getElementById('status-msg');
        const btnSubmit = document.getElementById('btn-submit');

        // ADMIN SECRET PASS (අවශ්‍ය පරිදි වෙනස් කරන්න)
        const SECRET_ADMIN_PASS = "URM2026ADMIN";

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const pass = document.getElementById('admin-pass').value;
            const lifeCode = document.getElementById('life-code-input').value.trim();
            const customerName = document.getElementById('customer-name-input').value.trim();
            const fileInput = document.getElementById('pdf-file-input');
            const file = fileInput.files[0];

            if (pass !== SECRET_ADMIN_PASS) {
                alert('වැරදි Admin Access Code එකකි!');
                return;
            }

            if (!file || file.type !== 'application/pdf') {
                alert('කරුණාකර වලංගු PDF ගොනුවක් තෝරන්න!');
                return;
            }

            btnSubmit.disabled = true;
            progBox.style.display = 'block';
            statusMsg.style.color = '#06b6d4';
            statusMsg.innerText = 'PDF ගොනුව Server එකට Upload වෙමින් පවතී...';

            try {
                // Storage Reference
                const storageRef = storage.ref(`blueprints/${lifeCode}.pdf`);
                const uploadTask = storageRef.put(file);

                uploadTask.on('state_changed', 
                    (snapshot) => {
                        const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                        progBar.style.width = progress + '%';
                        statusMsg.innerText = `Upload වෙමින් පවතී: ${Math.round(progress)}%`;
                    }, 
                    (error) => {
                        console.error('Upload Error:', error);
                        statusMsg.style.color = '#f43f5e';
                        statusMsg.innerText = 'Upload කිරීමේදී දෝෂයක් සිදු විය!';
                        btnSubmit.disabled = false;
                    }, 
                    async () => {
                        // Get Download URL
                        const downloadURL = await uploadTask.snapshot.ref.getDownloadURL();

                        // Save Record in Firestore
                        await db.collection('blueprints').doc(lifeCode).set({
                            lifeCode: lifeCode,
                            customerName: customerName || 'Valued Client',
                            pdfUrl: downloadURL,
                            uploadedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });

                        statusMsg.style.color = '#4ade80';
                        statusMsg.innerText = `සාර්ථකයි! Life Code (${lifeCode}) සඳහා Report එක සක්‍රීය කරන ලදී.`;
                        form.reset();
                        btnSubmit.disabled = false;
                    }
                );
            } catch (err) {
                console.error(err);
                statusMsg.style.color = '#f43f5e';
                statusMsg.innerText = 'දත්ත සමුදායේ දෝෂයක් පවතී!';
                btnSubmit.disabled = false;
            }
        });
    </script>
</body>
</html>
