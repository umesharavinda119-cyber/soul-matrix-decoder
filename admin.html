<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOUL MATRIX | Admin Control Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

    <!-- PDF Compression Libraries (PDF.js & jsPDF) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #04040c; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .admin-card { background: linear-gradient(135deg, rgba(12, 12, 28, 0.98), rgba(4, 4, 12, 0.99)); border: 1.5px solid #06b6d4; border-radius: 16px; padding: 2rem; width: 100%; max-width: 550px; box-shadow: 0 0 40px rgba(6, 182, 212, 0.25); }
        h2 { font-family: 'Orbitron', sans-serif; color: #06b6d4; text-align: center; margin-bottom: 20px; font-size: 1.4rem; letter-spacing: 1px; }
        
        /* Tabs */
        .tab-controls { display: flex; gap: 10px; margin-bottom: 25px; }
        .admin-tab-btn { flex: 1; padding: 10px; font-family: 'Orbitron', sans-serif; font-size: 0.9rem; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; transition: all 0.3s; background: rgba(255,255,255,0.1); color: #9ca3af; }
        .admin-tab-btn.active { background: #06b6d4; color: #000; box-shadow: 0 0 15px rgba(6, 182, 212, 0.4); }

        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 0.85rem; color: #f59e0b; margin-bottom: 8px; font-family: 'Orbitron', sans-serif; }
        input[type="text"], input[type="password"], input[type="file"], textarea { width: 100%; padding: 12px; background: rgba(2, 2, 10, 0.9); border: 1px solid rgba(6, 182, 212, 0.4); border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; }
        input[type="text"]:focus, textarea:focus { border-color: #f59e0b; box-shadow: 0 0 10px rgba(245, 158, 11, 0.3); }
        textarea { resize: vertical; min-height: 80px; }
        
        .upload-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #06b6d4, #0284c7); border: none; border-radius: 8px; color: #000; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1rem; cursor: pointer; transition: all 0.2s; margin-top: 10px; }
        .upload-btn:hover { background: linear-gradient(135deg, #38bdf8, #06b6d4); box-shadow: 0 0 20px rgba(6, 182, 212, 0.5); }
        .upload-btn:disabled { background: #475569; cursor: not-allowed; box-shadow: none; }
        
        .progress-box { display: none; margin-top: 15px; background: rgba(255,255,255,0.05); border-radius: 8px; padding: 10px; text-align: center; }
        .progress-bar { width: 0%; height: 8px; background: linear-gradient(90deg, #06b6d4, #f59e0b); border-radius: 4px; transition: width 0.2s; }
        .status-msg { margin-top: 10px; font-size: 0.85rem; font-weight: 600; text-align: center; }

        /* MANAGE ARTICLES CSS */
        .manage-art-list { margin-top: 30px; border-top: 1px solid rgba(6, 182, 212, 0.3); padding-top: 20px; }
        .manage-art-list h3 { font-size: 1rem; color: #fff; margin-bottom: 15px; text-align: left; font-family: 'Orbitron', sans-serif; }
        .manage-art-item { display: flex; justify-content: space-between; align-items: center; background: rgba(2, 2, 10, 0.8); padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .art-info strong { color: #f59e0b; font-size: 0.9rem; display: block; margin-bottom: 4px; }
        .art-info span { color: #9ca3af; font-size: 0.75rem; }
        .art-actions { display: flex; gap: 8px; }
        .art-actions button { border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; color: #fff; transition: all 0.2s; font-size: 0.85rem; font-family: 'Inter', sans-serif; font-weight: bold; }
        .btn-edit { background: #0ea5e9; }
        .btn-edit:hover { background: #0284c7; }
        .btn-del { background: #f43f5e; }
        .btn-del:hover { background: #e11d48; }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2><i class="fa-solid fa-user-shield"></i> MASTER CONTROL PANEL</h2>

        <!-- Password Field (Global for both forms) -->
        <div class="form-group" style="border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px;">
            <label>ADMIN ACCESS CODE</label>
            <input type="password" id="global-admin-pass" placeholder="Enter Secret Key" required>
        </div>
        
        <!-- Tab Controls -->
        <div class="tab-controls">
            <button class="admin-tab-btn active" id="tab-bp-btn">BLUEPRINTS</button>
            <button class="admin-tab-btn" id="tab-art-btn">ARTICLES</button>
        </div>

        <!-- BLUEPRINT UPLOAD FORM -->
        <form id="admin-upload-form">
            <div class="form-group">
                <label>CUSTOMER DIGIT LIFE CODE (8-DIGITS)</label>
                <input type="text" id="life-code-input" placeholder="E.g. 29637242" maxlength="8" pattern="\d{8}" required>
            </div>
            <div class="form-group">
                <label>CUSTOMER NAME (OPTIONAL)</label>
                <input type="text" id="customer-name-input" placeholder="E.g. Miheli Sahasna">
            </div>
            <div class="form-group">
                <label>SELECT BLUEPRINT PDF REPORT</label>
                <input type="file" id="pdf-file-input" accept="application/pdf" required>
            </div>
            <button type="submit" class="upload-btn" id="btn-submit">
                <i class="fa-solid fa-cloud-arrow-up"></i> UPLOAD & LINK REPORT
            </button>
            <div class="progress-box" id="prog-box-bp">
                <div class="progress-bar" id="prog-bar-bp"></div>
                <p class="status-msg" id="status-msg-bp">Preparing file...</p>
            </div>
        </form>

        <!-- ARTICLE UPLOAD / EDIT FORM -->
        <form id="article-upload-form" style="display: none;">
            <div class="form-group">
                <label>ARTICLE TITLE</label>
                <input type="text" id="art-title" placeholder="E.g. කර්මයේ බලපෑම..." required>
            </div>
            <div class="form-group">
                <label>EXCERPT (කෙටි හැඳින්වීම)</label>
                <textarea id="art-excerpt" placeholder="ලිපියේ අන්තර්ගතය ගැන කෙටි සටහනක්..." required></textarea>
            </div>
            <div class="form-group">
                <label>FACEBOOK POST LINK</label>
                <input type="text" id="art-link" placeholder="https://www.facebook.com/..." required>
            </div>
            <div class="form-group">
                <label>COVER IMAGE (JPG/PNG) <span id="img-optional-txt" style="display:none; color:#9ca3af; font-size:0.75rem;">- Optional when editing</span></label>
                <input type="file" id="art-image-input" accept="image/*" required>
            </div>
            
            <button type="submit" class="upload-btn" id="btn-art-submit" style="background: linear-gradient(135deg, #f59e0b, #d97706);">
                <i class="fa-solid fa-newspaper"></i> PUBLISH ARTICLE
            </button>
            
            <div class="progress-box" id="prog-box-art">
                <div class="progress-bar" id="prog-bar-art" style="background: #f59e0b;"></div>
                <p class="status-msg" id="status-msg-art">Preparing article...</p>
            </div>
        </form>

        <!-- MANAGE ARTICLES LIST -->
        <div id="manage-art-list-container" class="manage-art-list" style="display: none;">
            <h3><i class="fa-solid fa-list-check"></i> MANAGE POSTED ARTICLES</h3>
            <div id="manage-articles-list">
                <p style="font-size: 0.85rem; color: #9ca3af;">Loading articles...</p>
            </div>
        </div>

    </div>

    <script>
        // FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyAS1LHsxDHPFwxe7w8ByzbIdFbJogwnYq8",
            authDomain: "soul-matrix-b0fdf.firebaseapp.com",
            projectId: "soul-matrix-b0fdf",
            storageBucket: "soul-matrix-b0fdf.firebasestorage.app",
            messagingSenderId: "68411238048",
            appId: "1:68411238048:web:8ea31ad61d8c985d474bc5"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        const SECRET_ADMIN_PASS = "URM2026ADMIN";

        // Tab Switching Logic
        const tabBpBtn = document.getElementById('tab-bp-btn');
        const tabArtBtn = document.getElementById('tab-art-btn');
        const formBp = document.getElementById('admin-upload-form');
        const formArt = document.getElementById('article-upload-form');
        const manageArtContainer = document.getElementById('manage-art-list-container');

        tabBpBtn.addEventListener('click', () => {
            tabBpBtn.classList.add('active');
            tabArtBtn.classList.remove('active');
            formBp.style.display = 'block';
            formArt.style.display = 'none';
            manageArtContainer.style.display = 'none';
        });

        tabArtBtn.addEventListener('click', () => {
            tabArtBtn.classList.add('active');
            tabBpBtn.classList.remove('active');
            formArt.style.display = 'block';
            formBp.style.display = 'none';
            manageArtContainer.style.display = 'block';
            loadArticlesForManagement(); // Load list when tab opens
        });

        function checkAuth() {
            const pass = document.getElementById('global-admin-pass').value;
            if (pass !== SECRET_ADMIN_PASS) {
                alert('වැරදි Admin Access Code එකකි!');
                return false;
            }
            return true;
        }

        // ==========================================
        // 1. BLUEPRINT UPLOAD LOGIC 
        // ==========================================
        async function compressPDFFile(file, onProgress) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            const numPages = pdf.numPages;
            const { jsPDF } = window.jspdf;
            let compressedDoc = null;

            for (let i = 1; i <= numPages; i++) {
                if (onProgress) onProgress(i, numPages);
                const page = await pdf.getPage(i);
                const scale = 2.2; 
                const viewport = page.getViewport({ scale: scale });
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                
                await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                const imgData = canvas.toDataURL('image/jpeg', 0.85);
                const widthMm = (viewport.width * 25.4) / (96 * scale);
                const heightMm = (viewport.height * 25.4) / (96 * scale);

                if (i === 1) {
                    compressedDoc = new jsPDF({ orientation: widthMm > heightMm ? 'l' : 'p', unit: 'mm', format: [widthMm, heightMm] });
                } else {
                    compressedDoc.addPage([widthMm, heightMm], widthMm > heightMm ? 'l' : 'p');
                }
                compressedDoc.addImage(imgData, 'JPEG', 0, 0, widthMm, heightMm);
            }
            return compressedDoc.output('blob');
        }

        formBp.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!checkAuth()) return;

            const lifeCode = document.getElementById('life-code-input').value.trim();
            const customerName = document.getElementById('customer-name-input').value.trim();
            const fileInput = document.getElementById('pdf-file-input');
            const originalFile = fileInput.files[0];

            if (!originalFile || originalFile.type !== 'application/pdf') return alert('කරුණාකර වලංගු PDF ගොනුවක් තෝරන්න!');

            const btnSubmit = document.getElementById('btn-submit');
            const progBox = document.getElementById('prog-box-bp');
            const progBar = document.getElementById('prog-bar-bp');
            const statusMsg = document.getElementById('status-msg-bp');

            btnSubmit.disabled = true;
            progBox.style.display = 'block';
            progBar.style.width = '0%';
            statusMsg.style.color = '#f59e0b';

            try {
                let fileToUpload = originalFile;
                if (originalFile.size > 10 * 1024 * 1024) {
                    statusMsg.innerText = 'HD Auto-Compress වෙමින් පවතී...';
                    fileToUpload = await compressPDFFile(originalFile, (currentPage, totalPages) => {
                        progBar.style.width = Math.round((currentPage / totalPages) * 100) + '%';
                        statusMsg.innerText = `PDF Compress වෙමින් පවතී: පිටු ${currentPage} / ${totalPages}`;
                    });
                }

                statusMsg.style.color = '#06b6d4';
                statusMsg.innerText = 'Firebase Server එකට Upload වෙමින් පවතී...';
                
                const uploadTask = storage.ref(`blueprints/${lifeCode}.pdf`).put(fileToUpload);

                uploadTask.on('state_changed', 
                    (snapshot) => { progBar.style.width = ((snapshot.bytesTransferred / snapshot.totalBytes) * 100) + '%'; }, 
                    (error) => { statusMsg.style.color = '#f43f5e'; statusMsg.innerText = 'Upload Error!'; btnSubmit.disabled = false; }, 
                    async () => {
                        const downloadURL = await uploadTask.snapshot.ref.getDownloadURL();
                        await db.collection('blueprints').doc(lifeCode).set({
                            lifeCode: lifeCode, customerName: customerName || 'Valued Client', pdfUrl: downloadURL, uploadedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        statusMsg.style.color = '#4ade80';
                        statusMsg.innerText = `සාර්ථකයි! Life Code (${lifeCode}) සක්‍රීය කරන ලදී.`;
                        formBp.reset();
                        btnSubmit.disabled = false;
                    }
                );
            } catch (err) { statusMsg.innerText = 'දෝෂයක් සිදු විය!'; btnSubmit.disabled = false; }
        });

        // ==========================================
        // 2. ARTICLE PUBLISHING & MANAGEMENT LOGIC
        // ==========================================
        let editingArticleId = null;
        let articlesDataMap = {}; // Temporarily stores fetched article data

        async function loadArticlesForManagement() {
            const listDiv = document.getElementById('manage-articles-list');
            listDiv.innerHTML = '<p style="font-size: 0.85rem; color: #06b6d4;">ලිපි සොයමින් පවතී...</p>';
            
            try {
                const snapshot = await db.collection('articles').orderBy('timestamp', 'desc').get();
                listDiv.innerHTML = '';
                articlesDataMap = {};

                if(snapshot.empty) {
                    listDiv.innerHTML = '<p style="color:#9ca3af; font-size:0.85rem;">තවමත් ලිපි කිසිවක් පළ කර නොමැත.</p>';
                    return;
                }

                snapshot.forEach(doc => {
                    const data = doc.data();
                    articlesDataMap[doc.id] = data; // Save to map to prevent quote escaping issues

                    const item = document.createElement('div');
                    item.className = 'manage-art-item';
                    item.innerHTML = `
                        <div class="art-info">
                            <strong>${data.title}</strong>
                        </div>
                        <div class="art-actions">
                            <button type="button" class="btn-edit" onclick="startEditArticle('${doc.id}')"><i class="fa-solid fa-pen"></i> EDIT</button>
                            <button type="button" class="btn-del" onclick="deleteArticle('${doc.id}')"><i class="fa-solid fa-trash"></i> DELETE</button>
                        </div>
                    `;
                    listDiv.appendChild(item);
                });
            } catch (err) {
                listDiv.innerHTML = '<p style="color:#f43f5e; font-size:0.85rem;">ලිපි ලබාගැනීමේදී දෝෂයක් මතු විය.</p>';
            }
        }

        window.startEditArticle = function(id) {
            const data = articlesDataMap[id];
            if(!data) return;

            editingArticleId = id;
            document.getElementById('art-title').value = data.title;
            document.getElementById('art-excerpt').value = data.excerpt;
            document.getElementById('art-link').value = data.link;

            // Image is not required when editing
            document.getElementById('art-image-input').required = false;
            document.getElementById('img-optional-txt').style.display = 'inline';

            // Change Submit Button UI
            const btnSubmit = document.getElementById('btn-art-submit');
            btnSubmit.innerHTML = '<i class="fa-solid fa-pen-to-square"></i> UPDATE ARTICLE';
            btnSubmit.style.background = 'linear-gradient(135deg, #06b6d4, #0284c7)';

            // Add Cancel Edit Button
            if(!document.getElementById('cancel-edit-btn')) {
                const cancelBtn = document.createElement('button');
                cancelBtn.id = 'cancel-edit-btn';
                cancelBtn.type = 'button';
                cancelBtn.className = 'upload-btn';
                cancelBtn.style.background = '#475569';
                cancelBtn.style.marginTop = '10px';
                cancelBtn.innerHTML = '<i class="fa-solid fa-xmark"></i> CANCEL EDITING';
                cancelBtn.onclick = cancelEditMode;
                document.getElementById('article-upload-form').appendChild(cancelBtn);
            }
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.cancelEditMode = function() {
            editingArticleId = null;
            formArt.reset();
            document.getElementById('art-image-input').required = true;
            document.getElementById('img-optional-txt').style.display = 'none';

            const btnSubmit = document.getElementById('btn-art-submit');
            btnSubmit.innerHTML = '<i class="fa-solid fa-newspaper"></i> PUBLISH ARTICLE';
            btnSubmit.style.background = 'linear-gradient(135deg, #f59e0b, #d97706)';

            const cancelBtn = document.getElementById('cancel-edit-btn');
            if(cancelBtn) cancelBtn.remove();
        }

        window.deleteArticle = async function(id) {
            if (!checkAuth()) return;
            if (confirm('මෙම ලිපිය සම්පූර්ණයෙන්ම මකා දැමීමට අවශ්‍ය බව විශ්වාසද?')) {
                try {
                    await db.collection('articles').doc(id).delete();
                    alert('ලිපිය සාර්ථකව මකා දමන ලදී!');
                    loadArticlesForManagement(); // Refresh the list
                } catch(err) {
                    alert('මකා දැමීමේදී දෝෂයක් මතු විය!');
                }
            }
        }

        formArt.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!checkAuth()) return;

            const title = document.getElementById('art-title').value.trim();
            const excerpt = document.getElementById('art-excerpt').value.trim();
            const link = document.getElementById('art-link').value.trim();
            const imgFile = document.getElementById('art-image-input').files[0];

            // If it's a new article, Image is strictly required
            if (!editingArticleId && (!imgFile || !imgFile.type.startsWith('image/'))) {
                return alert('කරුණාකර පින්තූරයක් තෝරන්න (JPG/PNG)!');
            }

            const btnSubmit = document.getElementById('btn-art-submit');
            const progBox = document.getElementById('prog-box-art');
            const progBar = document.getElementById('prog-bar-art');
            const statusMsg = document.getElementById('status-msg-art');

            btnSubmit.disabled = true;
            progBox.style.display = 'block';
            progBar.style.width = '30%';
            statusMsg.style.color = '#f59e0b';
            statusMsg.innerText = 'Processing...';

            try {
                let imgUrl = null;

                // Only upload image if user selected a new one
                if (imgFile) {
                    statusMsg.innerText = 'Uploading new image...';
                    const imgRefName = `articles/${Date.now()}_${imgFile.name}`;
                    const uploadTask = await storage.ref(imgRefName).put(imgFile);
                    imgUrl = await uploadTask.ref.getDownloadURL();
                    progBar.style.width = '70%';
                }

                statusMsg.innerText = 'Database Update වෙමින් පවතී...';

                if (editingArticleId) {
                    // Update Mode
                    let updatePayload = { title, excerpt, link };
                    if (imgUrl) updatePayload.imageUrl = imgUrl; // Update image only if a new one was uploaded
                    
                    await db.collection('articles').doc(editingArticleId).update(updatePayload);
                    
                    statusMsg.style.color = '#4ade80';
                    statusMsg.innerText = `ලිපිය සාර්ථකව යාවත්කාලීන (Update) කරන ලදී!`;
                    cancelEditMode(); // Resets form and UI automatically
                } else {
                    // New Publish Mode
                    await db.collection('articles').add({
                        title: title,
                        excerpt: excerpt,
                        link: link,
                        imageUrl: imgUrl,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    statusMsg.style.color = '#4ade80';
                    statusMsg.innerText = `ලිපිය සාර්ථකව පබ්ලිෂ් කරන ලදී!`;
                    formArt.reset();
                }

                progBar.style.width = '100%';
                btnSubmit.disabled = false;
                loadArticlesForManagement(); // Refresh the visual list

            } catch (err) { 
                console.error(err);
                statusMsg.style.color = '#f43f5e'; 
                statusMsg.innerText = 'දෝෂයක් සිදු විය!'; 
                btnSubmit.disabled = false; 
            }
        });
    </script>
</body>
</html>
